<!--
  GTM · Tag "HTML personalizado" para o checkout Digital Manager Guru
  (pay.meurestart.com/pl/...)

  O que faz:
    1. Botão "Comprar Agora" sempre ativo (visual e clique).
       - Formulário completo: o clique segue normal para a Guru.
       - Formulário incompleto: mostra os erros nos campos, rola até o
         primeiro problema e dá foco nele (em vez de um botão cinza morto).
    2. Rodapé personalizado: selos de confiança, suporte, links e dados legais.

  Acionador recomendado: "Visualização de página - DOM pronto" (ou Window Loaded)
  com a condição Page Path contém /pl/  (veja gtm/README.md).

  Edite só o bloco CONFIG abaixo. Campos vazios ("") não aparecem na página.
-->
<script>
(function () {
  if (window.__lpCheckoutCustom) return;
  window.__lpCheckoutCustom = true;

  var CONFIG = {
    // --- Botão ---
    buttonColor: "",            // vazio = cor do botão definida na Guru. Ex.: "#ff4d2e"
    buttonTextColor: "",        // vazio = cor do texto definida na Guru. Ex.: "#ffffff"
    buttonPulse: true,          // leve animação chamando atenção para o botão

    // --- Rodapé ---
    hideGuruLogo: true,         // esconde o logo "Digital Manager Guru"
    hidePciBadge: false,        // esconde o selo PCI DSS (recomendado manter)
    hideRecaptchaText: false,   // esconde o texto do reCAPTCHA (o Google pede que fique visível)

    trustBadges: [              // selos exibidos acima do "Atendimento"
      { icon: "lock",   title: "Compra 100% segura",  text: "Seus dados protegidos" },
      { icon: "shield", title: "Garantia de 7 dias",  text: "Seu dinheiro de volta" },
      { icon: "truck",  title: "Envio para todo o Brasil", text: "Código de rastreio por e-mail" }
    ],
    whatsapp: "",               // só números com DDI+DDD. Ex.: "5511999999999"
    whatsappLabel: "WhatsApp",
    instagram: "",              // Ex.: "meurestart" (sem @)
    links: [
      { label: "Termos de uso",          url: "https://meurestart.com/termos-de-uso" },
      { label: "Política de privacidade", url: "" }
    ],
    legal: "",                  // Ex.: "Meu Restart LTDA · CNPJ 00.000.000/0001-00"
    brand: "Meu Restart"        // usado no "© 2026 Meu Restart"
  };

  /* ------------------------------------------------------------------ */
  /* Estilos                                                             */
  /* ------------------------------------------------------------------ */
  var BTN = 'main button.MuiButton-contained';
  var css = [
    // Botão sempre com cara de ativo
    BTN + '.Mui-disabled{',
    '  background-color:' + (CONFIG.buttonColor || 'var(--color-body-button)') + '!important;',
    '  color:' + (CONFIG.buttonTextColor || 'var(--color-body-button-text, #fff)') + '!important;',
    '  opacity:1!important;cursor:pointer!important;pointer-events:auto!important;}',
    CONFIG.buttonColor ? BTN + '{background-color:' + CONFIG.buttonColor + '!important;}' : '',
    CONFIG.buttonTextColor ? BTN + '{color:' + CONFIG.buttonTextColor + '!important;}' : '',
    BTN + '{font-weight:700!important;transition:filter .15s,transform .15s!important;}',
    BTN + ':hover{filter:brightness(1.08);}',
    BTN + ':active{transform:translateY(1px);}',
    CONFIG.buttonPulse ? '@keyframes lpPulse{0%{box-shadow:0 0 0 0 rgba(255,77,46,.45)}70%{box-shadow:0 0 0 12px rgba(255,77,46,0)}100%{box-shadow:0 0 0 0 rgba(255,77,46,0)}}' + BTN + '{animation:lpPulse 2.2s infinite;}' : '',
    // Aviso "*Existem campos inválidos" só aparece depois da 1ª tentativa
    'html:not([data-lp-tried]) [data-lp-warn]{display:none!important;}',
    'html:not([data-lp-tried]) ' + BTN + '{border-radius:6px!important;}',
    // Destaque do campo com problema
    '[data-lp-flag]{animation:lpShake .4s;}',
    '@keyframes lpShake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}',
    '[data-lp-flag="terms"]{outline:2px solid var(--color-body-input-invalid,#f25c5c);outline-offset:4px;border-radius:6px;}',
    // Rodapé
    CONFIG.hideGuruLogo ? 'footer a[href*="digitalmanager.guru"]{display:none!important;}' : '',
    CONFIG.hidePciBadge ? 'footer img[alt="PCI DSS"]{display:none!important;}' : '',
    CONFIG.hideRecaptchaText ? 'footer p[data-lp-recaptcha]{display:none!important;}' : '',
    CONFIG.hideGuruLogo ? 'footer img[alt="PCI DSS"]{margin:0 auto;}' : '',
    '.lp-badges{display:grid;grid-template-columns:1fr;gap:8px;}',
    '@media(min-width:640px){.lp-badges{grid-template-columns:repeat(' + CONFIG.trustBadges.length + ',1fr);gap:10px;}}',
    '.lp-badge{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--color-header-divider,rgba(255,255,255,.12));border-radius:10px;color:var(--color-header-text,#fff);}',
    '.lp-badge svg{flex:none;width:22px;height:22px;color:var(--color-body-button,#ff4d2e);}',
    '.lp-badge strong{display:block;font-size:13px;line-height:1.25;}',
    '.lp-badge small{display:block;font-size:11.5px;opacity:.7;line-height:1.3;}',
    '.lp-contact{display:flex;flex-wrap:wrap;gap:8px 18px;}',
    '.lp-contact a{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--color-header-text,#fff);text-decoration:none;}',
    '.lp-contact a:hover{color:var(--color-body-button,#ff4d2e);}',
    '.lp-contact svg{width:16px;height:16px;}',
    '.lp-legal{text-align:center;font-size:12px;line-height:1.6;color:var(--color-header-text,#fff);opacity:.7;}',
    '.lp-legal a{color:inherit;text-decoration:underline;}',
    '.lp-legal span+span:before{content:" · ";}'
  ].join('\n');
  var style = document.createElement('style');
  style.id = 'lp-checkout-css';
  style.textContent = css;
  document.head.appendChild(style);

  /* ------------------------------------------------------------------ */
  /* Botão sempre ativo                                                  */
  /* ------------------------------------------------------------------ */
  var lastRealClick = 0;

  function getBtn() { return document.querySelector(BTN); }

  // A Guru marca o botão com .Mui-disabled enquanto o form está incompleto.
  // Tiramos o atributo "disabled" (senão o navegador ignora o clique), mas
  // usamos a classe para saber se a Guru considera o form pronto.
  function unlock(btn) {
    if (!btn) return;
    if (btn.hasAttribute('disabled')) btn.removeAttribute('disabled');
    if (btn.getAttribute('tabindex') === '-1') btn.setAttribute('tabindex', '0');
    btn.removeAttribute('aria-disabled');
    var warn = btn.previousElementSibling;
    if (warn && !warn.hasAttribute('data-lp-warn') && /inv[aá]lidos/i.test(warn.textContent)) {
      warn.setAttribute('data-lp-warn', '');
    }
  }

  function isVisible(el) {
    if (!el) return false;
    var r = el.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return false;
    var s = getComputedStyle(el);
    return s.visibility !== 'hidden' && s.display !== 'none';
  }

  function flag(el, kind) {
    el.setAttribute('data-lp-flag', kind || '');
    setTimeout(function () { el.removeAttribute('data-lp-flag'); }, kind === 'terms' ? 2500 : 450);
  }

  function goTo(el, focusEl) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (focusEl) setTimeout(function () { try { focusEl.focus({ preventScroll: true }); } catch (e) {} }, 350);
  }

  function guideUser() {
    document.documentElement.setAttribute('data-lp-tried', '');
    var form = document.querySelector('main form') || document.querySelector('main');
    var fields = form.querySelectorAll('input:not([type=checkbox]):not([type=radio]):not([type=hidden]), textarea');

    // Toca (focus/blur) nos campos obrigatórios para a Guru exibir
    // "O campo é obrigatório" / "inválido" embaixo de cada um.
    var active = document.activeElement;
    for (var i = 0; i < fields.length; i++) {
      var f = fields[i];
      if (!isVisible(f) || !(f.required || f.getAttribute('aria-required') === 'true')) continue;
      try { f.focus({ preventScroll: true }); f.blur(); } catch (e) {}
    }
    if (active && active.blur && active !== document.body) { try { active.blur(); } catch (e) {} }

    setTimeout(function () {
      // 1º campo com erro
      for (var j = 0; j < fields.length; j++) {
        var el = fields[j];
        if (isVisible(el) && el.getAttribute('aria-invalid') === 'true') {
          var box = el.closest('.MuiFormControl-root') || el;
          flag(box); goTo(box, el); track('campo_invalido', el.id || el.name);
          return;
        }
      }
      // Termos de uso
      var terms = document.querySelector('main input[type=checkbox][required]');
      if (terms && !terms.checked) {
        var label = terms.closest('label') || terms;
        flag(label, 'terms'); goTo(label); track('termos_nao_aceitos');
        return;
      }
      // Sobrou o cartão (iframe seguro da Guru, não dá para ler)
      var card = document.querySelector('main iframe[title="checkout-elements"]');
      if (card && isVisible(card)) {
        flag(card); goTo(card); track('dados_cartao');
      }
    }, 120);
  }

  function track(reason, field) {
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ event: 'checkout_comprar_bloqueado', motivo: reason, campo: field || '' });
  }

  // Captura antes do React: se a Guru ainda considera o form incompleto,
  // seguramos o clique e guiamos o usuário. Senão, deixa passar.
  window.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest && e.target.closest(BTN);
    if (!btn) return;
    if (btn.classList.contains('Mui-disabled')) {
      e.preventDefault();
      e.stopImmediatePropagation();
      // Logo após um clique válido a Guru desabilita o botão enquanto processa:
      // nesse caso não fazemos nada.
      if (Date.now() - lastRealClick < 20000 && btn.querySelector('.MuiCircularProgress-root, [role=progressbar]')) return;
      guideUser();
    } else {
      lastRealClick = Date.now();
    }
  }, true);

  /* ------------------------------------------------------------------ */
  /* Rodapé                                                              */
  /* ------------------------------------------------------------------ */
  var ICONS = {
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
    shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
    truck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1-4.4-4.3 6.1-.8z"/></svg>',
    whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2-.2-.2-.5-.3z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>'
  };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function customizeFooter() {
    var footer = document.querySelector('footer');
    if (!footer || footer.querySelector('[data-lp-footer]')) return;

    // marca o parágrafo do reCAPTCHA para poder escondê-lo
    var ps = footer.querySelectorAll('p');
    for (var k = 0; k < ps.length; k++) if (/reCAPTCHA/i.test(ps[k].textContent)) ps[k].setAttribute('data-lp-recaptcha', '');

    // Selos
    if (CONFIG.trustBadges.length) {
      var badges = document.createElement('div');
      badges.className = 'lp-badges';
      badges.setAttribute('data-lp-footer', '');
      badges.innerHTML = CONFIG.trustBadges.map(function (b) {
        return '<div class="lp-badge">' + (ICONS[b.icon] || ICONS.star) +
          '<div><strong>' + esc(b.title) + '</strong>' + (b.text ? '<small>' + esc(b.text) + '</small>' : '') + '</div></div>';
      }).join('');
      footer.insertBefore(badges, footer.firstChild);
    }

    // Contatos extras ao lado do e-mail de atendimento
    var mail = footer.querySelector('a[href^="mailto:"]');
    var extra = '';
    if (CONFIG.whatsapp) extra += '<a href="https://wa.me/' + esc(CONFIG.whatsapp.replace(/\D/g, '')) + '" target="_blank" rel="noopener">' + ICONS.whatsapp + '<span>' + esc(CONFIG.whatsappLabel) + '</span></a>';
    if (CONFIG.instagram) extra += '<a href="https://instagram.com/' + esc(CONFIG.instagram.replace(/^@/, '')) + '" target="_blank" rel="noopener">' + ICONS.instagram + '<span>@' + esc(CONFIG.instagram.replace(/^@/, '')) + '</span></a>';
    if (extra && mail && mail.parentElement) {
      var c = document.createElement('div');
      c.className = 'lp-contact';
      c.setAttribute('data-lp-footer', '');
      c.innerHTML = extra;
      mail.parentElement.appendChild(c);
    }

    // Links + dados legais no fim
    var parts = [];
    CONFIG.links.forEach(function (l) {
      if (l.url) parts.push('<span><a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a></span>');
    });
    var lines = '';
    if (parts.length) lines += '<div>' + parts.join('') + '</div>';
    if (CONFIG.legal) lines += '<div>' + esc(CONFIG.legal) + '</div>';
    if (CONFIG.brand) lines += '<div>© ' + new Date().getFullYear() + ' ' + esc(CONFIG.brand) + '. Todos os direitos reservados.</div>';
    if (lines) {
      var legal = document.createElement('div');
      legal.className = 'lp-legal';
      legal.setAttribute('data-lp-footer', '');
      legal.innerHTML = lines;
      footer.appendChild(legal);
    }
  }

  /* ------------------------------------------------------------------ */
  /* A página é React (Next.js): reaplica quando o DOM muda              */
  /* ------------------------------------------------------------------ */
  var queued = false;
  function apply() {
    queued = false;
    unlock(getBtn());
    customizeFooter();
  }
  apply();
  new MutationObserver(function () {
    if (!queued) { queued = true; requestAnimationFrame(apply); }
  }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['disabled', 'class'] });
})();
</script>
